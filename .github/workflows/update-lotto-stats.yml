# trigger reindex
name: Update lotto stats

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      - name: 통계 갱신
        run: python fetch_lotto_stats.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lotto_stats.json
          git diff --staged --quiet || git commit -m "chore: 로또 통계 자동 갱신 ($(date +%F))"
          git push
